<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hucolor 配色展示</title>
  <style>
    html[data-theme="dark"] {
      --bg: #141416;
      --bg-panel: #232328;
      --bg-card: #2c2c34;
      --line: #3d3d46;
      --text: #c9c9cf;
      --text-strong: #f1f1f4;
      --text-muted: #8e8e97;
      --text-faint: #67676f;
      --accent: #a3a4ff;
      --warm: #f0a35e;
    }

    html[data-theme="light"] {
      --bg: #f7f7f5;
      --bg-panel: #ffffff;
      --bg-card: #f0eee9;
      --line: #e5e3de;
      --text: #333333;
      --text-strong: #161616;
      --text-muted: #6d6d6d;
      --text-faint: #9b9b9b;
      --accent: #4a5cd4;
      --warm: #d9582e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      font-size: 15px;
      line-height: 1.7;
      transition: background-color .3s, color .3s;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      color: var(--text-strong);
      letter-spacing: .5px;
    }

    .tagline {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    header button {
      margin-left: auto;
      padding: 7px 16px;
      font-size: 13px;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform .15s;
    }

    header button:hover {
      transform: translateY(-1px);
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 24px 72px;
    }

    .lede {
      max-width: 640px;
      color: var(--text-muted);
      margin: 8px 0 36px;
    }

    section {
      margin-bottom: 44px;
    }

    h2 {
      font-size: 21px;
      color: var(--text-strong);
      margin: 0 0 6px;
    }

    .sub {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0 0 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 20px;
    }

    .card h3 {
      margin: 0 0 14px;
      font-size: 15px;
      color: var(--text-strong);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
      gap: 12px;
    }

    .swatch {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chips {
      display: flex;
      gap: 6px;
    }

    .chip-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chip-col .chip {
      width: 100%;
    }

    .chip {
      flex: 1;
      height: 72px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
    }

    .chip-label {
      flex: none;
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .meta .role {
      color: var(--text-strong);
      font-size: 13.5px;
    }

    .meta .sem {
      color: var(--text-muted);
      font-size: 12px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--accent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    th,
    td {
      padding: 9px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    thead th {
      background: color-mix(in srgb, var(--line) 45%, transparent);
      color: var(--text-strong);
      font-weight: 600;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:nth-child(even) {
      background: color-mix(in srgb, var(--bg-panel) 45%, transparent);
    }

    .dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 3px;
      vertical-align: -1px;
      margin-right: 6px;
      border: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
    }

    .ansi-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
    }

    .ansi-cell {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-card);
    }

    .ansi-chip {
      height: 56px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 5px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .ansi-cell .idx {
      font-size: 11px;
      color: var(--text-faint);
      padding: 5px 8px 7px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      display: flex;
      justify-content: space-between;
    }

    .ansi-cell .idx b {
      color: var(--text-muted);
      font-weight: 600;
    }

    footer {
      text-align: center;
      color: var(--text-faint);
      font-size: 12.5px;
      padding: 24px 16px 48px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 640px) {
      .ansi-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      main {
        padding: 22px 14px 56px;
      }

      header {
        padding: 12px 16px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>hucolor</h1>
    <p class="tagline">暖纸 · 靛蓝 · 陶土橙</p>
    <button id="modeToggle">切换到亮色</button>
  </header>

  <main>
    <p class="lede">低饱和、暖底、冷主色的配色体系。暗色为默认变体（微紫深灰），亮色为暖纸风格。数据来源 <code>colors-definition.json</code>，页面可切换暗 / 亮展示模式。</p>

    <section id="mapping">
      <h2>语义角色映射</h2>
      <p class="sub">语法 / UI 高亮统一使用语义名，暗 / 亮两套取值。</p>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>语义名</th>
              <th>暗色</th>
              <th>亮色</th>
              <th>典型用途</th>
            </tr>
          </thead>
          <tbody id="mappingBody"></tbody>
        </table>
      </div>
    </section>

    <section id="dark">
      <h2>暗色</h2>
      <p class="sub">背景层级：定义值（设计基准）与提亮应用值（终端 / 编辑器）并列展示。</p>
      <div class="card" id="darkBg"></div>
      <div class="card" id="darkText"></div>
      <div class="card" id="darkAccent"></div>
      <div class="card" id="darkAnsi"></div>
    </section>

    <section id="light">
      <h2>亮色</h2>
      <p class="sub">亮色各角色定义即应用，单值展示。</p>
      <div class="card" id="lightBg"></div>
      <div class="card" id="lightText"></div>
      <div class="card" id="lightAccent"></div>
      <div class="card" id="lightAnsi"></div>
    </section>
  </main>

  <footer>hucolor 配色参考 · <span id="version"></span> · 暖纸 + 靛蓝 + 陶土橙</footer>

  <script>
    const chipText = (hex) => {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 140 ? '#161616' : '#f1f1f4';
    };

    const swatchCard = (role, sem, hex, desc) => `
  <div class="swatch">
    <div class="chips">
      <div class="chip" style="background:${hex};color:${chipText(hex)}">${hex}</div>
    </div>
    <div class="meta">
      <span class="role">${role}</span>
      <span class="sem">${sem || ''}</span>
      <span style="font-size:12px;color:var(--text-faint)">${desc || ''}</span>
    </div>
  </div>`;

    const dualCard = (role, sem, def, app, desc) => `
  <div class="swatch">
    <div class="chips">
      <div class="chip-col">
        <div class="chip" style="background:${def};color:${chipText(def)}">${def}</div>
        <div class="chip-label">定义值</div>
      </div>
      <div class="chip-col">
        <div class="chip" style="background:${app};color:${chipText(app)}">${app}</div>
        <div class="chip-label">提亮应用</div>
      </div>
    </div>
    <div class="meta">
      <span class="role">${role}</span>
      <span class="sem">${sem}</span>
      <span style="font-size:12px;color:var(--text-faint)">${desc || ''}</span>
    </div>
  </div>`;

    const ansiCell = (idx, hex, note) => `
  <div class="ansi-cell">
    <div class="ansi-chip" style="background:${hex};color:${chipText(hex)}">${hex}</div>
    <div class="idx"><span>Color${idx}</span><b>${note}</b></div>
  </div>`;

    const grid = (items) => `<div class="grid">${items.join('')}</div>`;

    const render = (darkBg, darkText, darkAccent, darkAnsi, lightBg, lightText, lightAccent, lightAnsi, mapping) => {
      document.getElementById('darkBg').innerHTML = '<h3>背景层级</h3>' + grid(darkBg);
      document.getElementById('darkText').innerHTML = '<h3>文字层级</h3>' + grid(darkText);
      document.getElementById('darkAccent').innerHTML = '<h3>强调与语义色</h3>' + grid(darkAccent);
      document.getElementById('darkAnsi').innerHTML = '<h3>终端 ANSI 16 色</h3>' + '<div class="ansi-grid">' + darkAnsi.join('') + '</div>';

      document.getElementById('lightBg').innerHTML = '<h3>背景层级</h3>' + grid(lightBg);
      document.getElementById('lightText').innerHTML = '<h3>文字层级</h3>' + grid(lightText);
      document.getElementById('lightAccent').innerHTML = '<h3>强调与语义色</h3>' + grid(lightAccent);
      document.getElementById('lightAnsi').innerHTML = '<h3>终端 ANSI 16 色</h3>' + '<div class="ansi-grid">' + lightAnsi.join('') + '</div>';

      document.getElementById('mappingBody').innerHTML = mapping.map(m => `
    <tr>
      <td><code>${m[0]}</code></td>
      <td><span class="dot" style="background:${m[1]}"></span><code>${m[1]}</code></td>
      <td><span class="dot" style="background:${m[2]}"></span><code>${m[2]}</code></td>
      <td>${m[3]}</td>
    </tr>`).join('');
    };

    const sections = ['background', 'text', 'accent', 'ansi'];

    const colorOf = (themes, theme, name) => {
      for (const sec of sections) {
        const hit = themes[theme][sec].find(it => it.name === name);
        if (hit) return hit.color_base;
      }
      return '';
    };

    fetch('colors-definition.json')
      .then((resp) => resp.json())
      .then((config) => {
        document.title = 'hucolor 配色展示 · ' + config.version;
        document.getElementById('version').textContent = config.version;
        const themes = config.themes;
        const d = themes.dark;
        const l = themes.light;

        const darkBg = d.background.map(e => dualCard(e.role, e.name, e.color_base, e.color_bright, e.description));
        const darkText = d.text.map(e => swatchCard(e.role, e.name, e.color_base, e.description));
        const darkAccent = d.accent.map(e => swatchCard(e.role, e.name, e.color_base, e.description));
        const darkAnsi = d.ansi.map(e => ansiCell(parseInt(e.role.slice(5), 10), e.color_base, e.name));

        const lightBg = l.background.map(e => swatchCard(e.role, e.name, e.color_base, e.description));
        const lightText = l.text.map(e => swatchCard(e.role, e.name, e.color_base, e.description));
        const lightAccent = l.accent.map(e => swatchCard(e.role, e.name, e.color_base, e.description));
        const lightAnsi = l.ansi.map(e => ansiCell(parseInt(e.role.slice(5), 10), e.color_base, e.name));

        const mapping = Object.entries(config.accent_desc).map(([name, desc]) =>
          [name, colorOf(themes, 'dark', name), colorOf(themes, 'light', name), desc]);

        render(darkBg, darkText, darkAccent, darkAnsi, lightBg, lightText, lightAccent, lightAnsi, mapping);
      })
      .catch((err) => {
        document.querySelector('main').innerHTML = '<p class="sub">无法加载 colors-definition.json：' + err + '</p>';
      });

    document.getElementById('modeToggle').addEventListener('click', () => {
      const html = document.documentElement;
      const isDark = html.dataset.theme === 'dark';
      html.dataset.theme = isDark ? 'light' : 'dark';
      document.getElementById('modeToggle').textContent = isDark ? '切换到暗色' : '切换到亮色';
    });
  </script>
</body>

</html>
